<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeSecureChat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 30px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      color: #b8c1d9;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 50px;
      color: #78839c;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🔒</div>

    <h1>SafeSecureChat</h1>

    <p>
      A secure and simple real-time messaging experience.
      Connect, communicate and stay connected.
    </p>

    <a href="#" class="button">Get Started</a>

    <div class="footer">
      © 2026 SafeSecureChat. All rights reserved.
    </div>

  </div>

</body>
</html>
