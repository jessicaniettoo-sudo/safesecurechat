<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SafeSecure Help Center</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8ff;
      color: #111111;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      height: 195px;
      background: linear-gradient(135deg, #4b20f5, #4920ff);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4%;
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /*
      SafeSecure custom logo mark
    */
    .logo-mark {
      width: 58px;
      height: 58px;
      position: relative;
    }

    .logo-mark .shape-one {
      position: absolute;
      width: 42px;
      height: 18px;
      background: white;
      left: 0;
      top: 8px;
      transform: skewX(-35deg);
      border-radius: 2px;
    }

    .logo-mark .shape-two {
      position: absolute;
      width: 42px;
      height: 18px;
      background: white;
      right: 0;
      bottom: 8px;
      transform: skewX(-35deg);
      border-radius: 2px;
    }

    .logo-mark .cut {
      position: absolute;
      width: 23px;
      height: 23px;
      background: #4b20f5;
      left: 18px;
      top: 18px;
      transform: rotate(45deg);
    }

    .brand-name {
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 43px;
    }

    /* Globe */

    .globe {
      width: 49px;
      height: 49px;
      border: 4px solid white;
      border-radius: 50%;
      position: relative;
    }

    .globe::before {
      content: "";
      position: absolute;
      width: 17px;
      height: 41px;
      border-left: 3px solid white;
      border-right: 3px solid white;
      border-radius: 50%;
      left: 12px;
      top: 0;
    }

    .globe::after {
      content: "";
      position: absolute;
      width: 40px;
      height: 3px;
      background: white;
      left: 1px;
      top: 19px;
    }

    /* Download */

    .download {
      width: 45px;
      height: 48px;
      position: relative;
    }

    .download::before {
      content: "";
      position: absolute;
      width: 4px;
      height: 31px;
      background: white;
      left: 20px;
      top: 0;
    }

    .download::after {
      content: "";
      position: absolute;
      width: 17px;
      height: 17px;
      border-right: 4px solid white;
      border-bottom: 4px solid white;
      transform: rotate(45deg);
      left: 13px;
      top: 10px;
    }

    .download-bottom {
      position: absolute;
      width: 42px;
      height: 20px;
      border-left: 4px solid white;
      border-right: 4px solid white;
      border-bottom: 4px solid white;
      border-radius: 0 0 8px 8px;
      bottom: 0;
      left: 1px;
    }

    /* Hamburger */

    .hamburger {
      width: 62px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .hamburger span {
      height: 4px;
      width: 62px;
      background: white;
    }


    /* =========================
       MAIN CONTENT
    ========================= */

    .content {
      padding: 170px 7% 120px;
      background: #f7f8ff;
    }

    .breadcrumb {
      font-size: 31px;
      margin-bottom: 48px;
      color: #666666;
    }

    .breadcrumb .blue {
      color: #4930f4;
    }

    /* Search */

    .search-box {
      height: 95px;
      width: 100%;
      background: #ffffff;
      border: 2px solid #d6d6d6;
      border-radius: 55px;
      display: flex;
      align-items: center;
      padding: 0 35px;
      margin-bottom: 72px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .search-icon {
      width: 32px;
      height: 32px;
      border: 4px solid #777777;
      border-radius: 50%;
      position: relative;
      margin-right: 27px;
      flex-shrink: 0;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 17px;
      height: 4px;
      background: #777777;
      right: -14px;
      bottom: -8px;
      transform: rotate(45deg);
      border-radius: 3px;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 31px;
      background: transparent;
      color: #333333;
    }

    .search-input::placeholder {
      color: #999999;
    }


    /* Heading */

    .title {
      font-size: 66px;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 31px;
      margin-bottom: 35px;
    }


    /* =========================
       CHAT BUTTON
    ========================= */

    .chat-button {
      width: 100%;
      min-height: 95px;
      background: linear-gradient(135deg, #4b20f5, #5128ff);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 42px;
      color: white;
      text-decoration: none;
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
      box-shadow: 0 5px 15px rgba(73, 32, 245, 0.15);
      margin-bottom: 24px;
    }

    .chat-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(73, 32, 245, 0.25);
    }

    /* Telegram-style paper plane icon */

    .telegram-icon {
      width: 58px;
      height: 58px;
      margin-right: 30px;
      position: relative;
      flex-shrink: 0;
    }

    .telegram-icon::before {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      border-top: 27px solid transparent;
      border-bottom: 27px solid transparent;
      border-right: 50px solid white;
      transform: rotate(-25deg);
      left: 2px;
      top: 2px;
    }

    .telegram-icon::after {
      content: "";
      position: absolute;
      width: 27px;
      height: 4px;
      background: #4b20f5;
      transform: rotate(-38deg);
      left: 14px;
      top: 31px;
    }

    .chat-text {
      font-size: 31px;
      font-weight: 500;
      flex: 1;
    }

    .arrow {
      font-size: 52px;
      font-weight: 200;
      line-height: 1;
    }


    /* =========================
       DROPDOWN
    ========================= */

    .dropdown {
      width: 100%;
      min-height: 95px;
      background: white;
      border: 3px solid #4a30ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 27px;
      font-size: 28px;
      cursor: pointer;
    }

    .dropdown-arrow {
      color: #888888;
      font-size: 28px;
    }


    /* =========================
       PURPLE ILLUSTRATION SECTION
    ========================= */

    .illustration-section {
      height: 650px;
      width: 100%;
      background: linear-gradient(135deg, #4b20f5, #4420d9);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /*
      Large SafeSecure security shield
    */

    .security-card {
      width: 410px;
      height: 550px;
      background: white;
      border: 10px solid #11133d;
      border-radius: 75px 75px 100px 100px;
      position: relative;
      transform: rotate(-8deg) translateY(135px);
    }

    /* Dark upper section */

    .security-card .top-dark {
      position: absolute;
      width: 245px;
      height: 160px;
      background: #11133d;
      right: -35px;
      top: -18px;
      border-radius: 100px 100px 20px 20px;
    }

    /* Mint accent */

    .security-card .mint-one {
      position: absolute;
      width: 72px;
      height: 40px;
      background: #69efba;
      left: -10px;
      top: 2px;
      border-radius: 15px;
    }

    .security-card .mint-two {
      position: absolute;
      width: 55px;
      height: 100px;
      background: #69efba;
      right: -14px;
      top: 170px;
      border-radius: 8px;
    }

    .security-card .mint-three {
      position: absolute;
      width: 55px;
      height: 100px;
      background: #69efba;
      right: -14px;
      top: 290px;
      border-radius: 8px;
    }

    /* Central secure symbol */

    .secure-symbol {
      position: absolute;
      width: 175px;
      height: 175px;
      left: 105px;
      top: 180px;
    }

    .secure-symbol::before {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      border: 32px solid #11133d;
      border-radius: 50%;
      left: 30px;
      top: 20px;
    }

    .secure-symbol::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 32px;
      background: #11133d;
      transform: rotate(32deg);
      left: 43px;
      top: 93px;
      border-radius: 3px;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

      .header {
        height: 130px;
      }

      .brand-name {
        font-size: 36px;
      }

      .content {
        padding: 100px 5% 90px;
      }

      .breadcrumb {
        font-size: 23px;
      }

      .title {
        font-size: 52px;
      }

      .subtitle {
        font-size: 25px;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header {
        height: 105px;
        padding: 0 20px;
      }

      .brand {
        gap: 12px;
      }

      .logo-mark {
        width: 40px;
        height: 40px;
      }

      .logo-mark .shape-one,
      .logo-mark .shape-two {
        width: 29px;
        height: 12px;
      }

      .logo-mark .shape-two {
        right: 0;
        bottom: 6px;
      }

      .logo-mark .shape-one {
        left: 0;
        top: 6px;
      }

      .logo-mark .cut {
        width: 16px;
        height: 16px;
        left: 13px;
        top: 12px;
      }

      .brand-name {
        font-size: 28px;
        letter-spacing: -1px;
      }

      .header-actions {
        gap: 18px;
      }

      .globe {
        width: 31px;
        height: 31px;
        border-width: 2px;
      }

      .globe::before {
        width: 11px;
        height: 27px;
        left: 8px;
        border-width: 2px;
      }

      .globe::after {
        width: 25px;
        height: 2px;
        top: 12px;
        left: 1px;
      }

      .download {
        width: 30px;
        height: 32px;
      }

      .download::before {
        width: 3px;
        height: 20px;
        left: 13px;
      }

      .download::after {
        width: 11px;
        height: 11px;
        left: 8px;
        top: 6px;
        border-width: 3px;
      }

      .download-bottom {
        width: 28px;
        height: 14px;
        border-width: 3px;
        left: 1px;
      }

      .hamburger {
        width: 38px;
        gap: 7px;
      }

      .hamburger span {
        width: 38px;
        height: 3px;
      }


      .content {
        padding: 75px 24px 70px;
      }

      .breadcrumb {
        font-size: 17px;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .search-box {
        height: 66px;
        padding: 0 22px;
        margin-bottom: 55px;
      }

      .search-icon {
        width: 23px;
        height: 23px;
        border-width: 3px;
        margin-right: 18px;
      }

      .search-icon::after {
        height: 3px;
        width: 13px;
        right: -11px;
        bottom: -6px;
      }

      .search-input {
        font-size: 20px;
      }

      .title {
        font-size: 42px;
        margin-bottom: 15px;
      }

      .subtitle {
        font-size: 20px;
        margin-bottom: 25px;
      }

      .chat-button {
        min-height: 70px;
        padding: 0 20px;
        border-radius: 10px;
        margin-bottom: 18px;
      }

      .telegram-icon {
        width: 40px;
        height: 40px;
        margin-right: 20px;
      }

      .telegram-icon::before {
        border-top-width: 19px;
        border-bottom-width: 19px;
        border-right-width: 35px;
      }

      .telegram-icon::after {
        width: 20px;
        height: 3px;
        left: 10px;
        top: 22px;
      }

      .chat-text {
        font-size: 21px;
      }

      .arrow {
        font-size: 38px;
      }

      .dropdown {
        min-height: 70px;
        font-size: 21px;
        border-width: 2px;
        padding: 0 18px;
      }

      .dropdown-arrow {
        font-size: 22px;
      }

      .illustration-section {
        height: 430px;
      }

      .security-card {
        width: 275px;
        height: 360px;
        border-width: 7px;
        border-radius: 55px 55px 75px 75px;
        transform: rotate(-8deg) translateY(90px);
      }

      .security-card .top-dark {
        width: 165px;
        height: 110px;
        right: -25px;
        top: -12px;
      }

      .security-card .mint-one {
        width: 48px;
        height: 28px;
        top: 1px;
      }

      .security-card .mint-two,
      .security-card .mint-three {
        width: 38px;
        height: 65px;
        right: -10px;
      }

      .security-card .mint-two {
        top: 110px;
      }

      .security-card .mint-three {
        top: 190px;
      }

      .secure-symbol {
        width: 125px;
        height: 125px;
        left: 72px;
        top: 118px;
      }

      .secure-symbol::before {
        width: 75px;
        height: 75px;
        border-width: 22px;
        left: 22px;
        top: 15px;
      }

      .secure-symbol::after {
        width: 63px;
        height: 23px;
        left: 31px;
        top: 63px;
      }
    }

  </style>
</head>


<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div class="brand">

      <div class="logo-mark">
        <div class="shape-one"></div>
        <div class="shape-two"></div>
        <div class="cut"></div>
      </div>

      <div class="brand-name">
        SafeSecure
      </div>

    </div>


    <div class="header-actions">

      <div class="globe"></div>

      <div class="download">
        <div class="download-bottom"></div>
      </div>

      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="content">

    <div class="breadcrumb">

      <span class="blue">
        Safepal Help Center
      </span>

      &nbsp;&nbsp;&gt;&nbsp;&nbsp;

      <span>
        Contact Live Agent
      </span>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

      <div class="search-icon"></div>

      <input
        class="search-input"
        type="text"
        placeholder="Search"
        aria-label="Search"
      >

    </div>


    <!-- TITLE -->

    <h1 class="title">
      Contact Live Agent
    </h1>

    <p class="subtitle">
      Hi! How can we help you today?
    </p>


    <!-- CHAT BUTTON
         Telegram destination is intentionally
         not displayed on the page.
    -->

    <a
      class="chat-button"
      href="https://t.me/Safesecure222"
      target="_blank"
      rel="noopener noreferrer"
    >

      <div class="telegram-icon"></div>

      <span class="chat-text">
        Chat with us
      </span>

      <span class="arrow">
        →
      </span>

    </a>


    <!-- DROPDOWN -->

    <div class="dropdown">

      <span>-</span>

      <span class="dropdown-arrow">
        ▼
      </span>

    </div>

  </main>



  <!-- =========================
       ILLUSTRATION
  ========================== -->

  <section class="illustration-section">

    <div class="security-card">

      <div class="top-dark"></div>

      <div class="mint-one"></div>

      <div class="mint-two"></div>

      <div class="mint-three"></div>

      <div class="secure-symbol"></div>

    </div>

  </section>


</body>
</html>
